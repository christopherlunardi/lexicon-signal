# Puts the installable web app (web/, made by tools/web.py) on GitHub Pages whenever it changes on main.
name: Web app
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # GitHub sometimes can't find the just-uploaded files on the first try ("No artifacts named github-pages"), which left the site
      # on an old build (2026-11-23): try again after a short wait
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
