// The Lexicon Signal app for Android (the Retroid Pocket 2S and Pocket 6, from a frontend or the home screen). Built by GitHub
// (.github/workflows/android.yml) and put on the "launcher" release. The game itself updates over the air (MainActivity); the app
// only needs reinstalling when MainActivity changes (it offers UPDATE APP on the title menu when it does).
plugins { id 'com.android.application' }
android {
  namespace 'com.idlelooping.lexiconsignal'
  compileSdk 34
  defaultConfig { applicationId 'com.idlelooping.lexiconsignal'; minSdk 24; targetSdk 34
    versionCode((System.getenv('VERSION_CODE') ?: '1') as Integer); versionName '1.' + (System.getenv('VERSION_CODE') ?: '0') }
  signingConfigs { sideload { storeFile file('../lexiconsignal-sideload.jks'); storePassword 'lexiconsignal'; keyAlias 'ls'; keyPassword 'lexiconsignal' } } // a fixed key, so each new build installs over the last (sideloading only)
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.sideload } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
