  color-scheme:dark;
}

.top b{color:var(--accent);font-weight:700;letter-spacing:.18em}

  box-shadow:0 0 0 3px var(--shell-hi),0 0 0 4px #000,0 18px 40px rgba(0,0,0,.55);overflow:hidden;position:relative;touch-action:none}

<div id="console">
  <div class="top"><b>Lexicon Signal</b><span id="buildTag"></span></div>
  <div id="screenWrap"><canvas id="screen" width="1280" height="720" aria-label="Game screen"></canvas></div>
  <div class="pad" id="pad">
    <div class="dpad" id="dpad" aria-label="Direction pad"><span class="h"></span><span class="v"></span><i class="up"></i><i class="dn"></i><i class="lf"></i><i class="rt"></i></div>

    <div class="pills"><button class="pill" id="btnSel" aria-label="Select"><span class="cap">SELECT</span></button><button class="pill" id="btnStart" aria-label="Start, pause"><span class="cap">PAUSE</span></button></div>
  </div>
  <p class="foot">Move <kbd>WASD</kbd> <kbd>Arrows</kbd> · Pick letter, again to send <kbd>Space</kbd> <kbd>Enter</kbd> · Back <kbd>Backspace</kbd> · Retune <kbd>R</kbd> · Pause <kbd>Esc</kbd> <kbd>P</kbd> · Or click / tap letters, or drag across them</p>
</div>

/* ================= the Android app (the launcher on the Retroids) =================
   The app plays the newest build it has (downloaded from GitHub, or the one inside it), offline too. Android's WebView doesn't hand
