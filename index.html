<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const DICT = new Set((window.LEX_WORDS || "").split(" "));
const cv = $("screen"), ctx = cv.getContext("2d");          // the screen: 2 fine pixels per world pixel
const H = 360, BAR_H = 101, SCENE_H = H - BAR_H, FINE = 2;
const BIN = { t: 11, b: 11, l: 13, r: 13 };                  // the bar's inner gold border: everything sits inside it
let W = 640, TK = 1;   // TK: text scale, 1.5 when the screen is small (phones) so typed text stays readable
const world = document.createElement("canvas"), wctx = world.getContext("2d");   // the room, keys and bar, in world pixels
const over = document.createElement("canvas"), octx = over.getContext("2d");     // menus over the room, in world pixels

/* ================= assets ================= */
let A = null, atlasImg = null, PAL = [], ROOMPAL = [], LUT = null;
function nearest(pal, r, g, b) { let bi = 0, bd = 1e9; for (let i = 0; i < pal.length; i++) { const p = pal[i], d = (p[0] - r) ** 2 + (p[1] - g) ** 2 + (p[2] - b) ** 2; if (d < bd) { bd = d; bi = i; } } return pal[bi]; }
const hex = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
const C = {};
function makeColours() {
  const want = {
    ink: [58, 32, 16], inkSoft: [118, 82, 48], inkRed: [150, 40, 26], keyFill: [62, 40, 24], keyEdge: [110, 74, 40], keyTop: [150, 100, 52], keyShadow: [26, 16, 10],
    selFill: [120, 74, 30], selEdge: [210, 150, 70], amber: [255, 176, 64], hot: [255, 244, 214], gold: [255, 214, 120], brassHi: [240, 210, 140],
    lamp: [255, 206, 84], red: [232, 48, 36], redHot: [255, 104, 72], needle: [190, 40, 30], snow: [190, 190, 200], snowDim: [110, 110, 130],
    shade: [8, 6, 10], dark: [20, 12, 8], glass: [28, 18, 12], dotOff: [58, 34, 18], dotDim: [120, 70, 30], blue: [150, 196, 255],
  };
  for (const k in want) C[k] = hex(nearest(PAL, ...want[k]));
}
function buildLUT() {
  LUT = new Uint8Array(32 * 32 * 32 * 3);
  for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
    const p = nearest(ROOMPAL, r * 8 + 4, g * 8 + 4, b * 8 + 4), i = ((r * 32 + g) * 32 + b) * 3; LUT[i] = p[0]; LUT[i + 1] = p[1]; LUT[i + 2] = p[2]; }
}
const R = (n) => A.rects[n], P = (n) => A.points[n] || {};
function spr(c, n, x, y, sx, sy, sw, sh) { const r = R(n); if (sw == null) c.drawImage(atlasImg, r[0], r[1], r[2], r[3], Math.round(x), Math.round(y), r[2], r[3]);
  else c.drawImage(atlasImg, r[0] + sx, r[1] + sy, sw, sh, Math.round(x), Math.round(y), sw, sh); }
// 9-slice: real corners, edges and middle repeat a narrow plain strip from the centre (no rivets or seams repeat)
function nine(c, n, x, y, w, h, m = 18) {
  const [, , sw, sh] = R(n), S2 = 12, cx = Math.floor(sw / 2 - S2 / 2), cy = Math.floor(sh / 2 - S2 / 2);
  spr(c, n, x, y, 0, 0, m, m); spr(c, n, x + w - m, y, sw - m, 0, m, m); spr(c, n, x, y + h - m, 0, sh - m, m, m); spr(c, n, x + w - m, y + h - m, sw - m, sh - m, m, m);
  for (let xx = x + m; xx < x + w - m; xx += S2) { const ww = Math.min(S2, x + w - m - xx); spr(c, n, xx, y, cx, 0, ww, m); spr(c, n, xx, y + h - m, cx, sh - m, ww, m); }
  for (let yy = y + m; yy < y + h - m; yy += S2) { const hh = Math.min(S2, y + h - m - yy); spr(c, n, x, yy, 0, cy, m, hh); spr(c, n, x + w - m, yy, sw - m, cy, m, hh);
    for (let xx = x + m; xx < x + w - m; xx += S2) spr(c, n, xx, yy, cx, cy, Math.min(S2, x + w - m - xx), hh); }
}
function dot(c, x, y, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), 1, 1); }
function line(c, x0, y0, x1, y1, col, w = 1) { x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); c.fillStyle = col;

let padCur = null, padTimer = null;

/* ================= sound: Web Audio synth, 84 BPM night pulse ================= */
