}

<div id="console">

  </div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const DICT = new Set((window.LEX_WORDS || "").split(" "));
const cv = $("screen"), ctx = cv.getContext("2d");
const H = 270, BAR_H = 76, SCENE_H = H - BAR_H, BAR_SRC_H = 66; // the bar art is 66 tall; its plain middle rows repeat to make it taller
const BIN = { t: 8, b: 8, l: 10, r: 10 }; // the bar's inner gold border: everything sits inside it
let W = 480;

/* ================= assets ================= */
let A = null, atlasImg = null;           // atlas.json + atlas.png
let PAL = [], ROOMPAL = [], LUT = null;  // full palette, palette without glow accents, rgb -> room palette lookup
function nearest(pal, r, g, b) { let bi = 0, bd = 1e9; for (let i = 0; i < pal.length; i++) { const p = pal[i], d = (p[0] - r) ** 2 + (p[1] - g) ** 2 + (p[2] - b) ** 2; if (d < bd) { bd = d; bi = i; } } return pal[bi]; }
const hex = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
const C = {};                             // named colours, snapped to the palette at load
function makeColours() {
  const want = {
    ink: [60, 34, 16], inkRed: [150, 40, 26], keyFill: [66, 42, 24], keyEdge: [110, 74, 40], keyTop: [150, 100, 52],
    selFill: [120, 74, 30], selEdge: [210, 150, 70], amber: [255, 176, 64], hot: [255, 244, 214], gold: [255, 214, 120],
    lamp: [255, 206, 84], red: [232, 48, 36], redHot: [255, 104, 72], needle: [190, 40, 30], snow: [190, 190, 200], snowDim: [110, 110, 130],
    shade: [8, 6, 10], cream: [236, 210, 160], dark: [20, 12, 8], blue: [150, 196, 255],
  };
  for (const k in want) C[k] = hex(nearest(PAL, ...want[k]));
}
function buildLUT() {
  LUT = new Uint8Array(32 * 32 * 32 * 3);
  for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
    const p = nearest(ROOMPAL, r * 8 + 4, g * 8 + 4, b * 8 + 4), i = ((r * 32 + g) * 32 + b) * 3; LUT[i] = p[0]; LUT[i + 1] = p[1]; LUT[i + 2] = p[2];
  }
}
const R = (n) => A.rects[n];
const P = (n) => A.points[n] || {};
function spr(c, n, x, y, sx, sy, sw, sh) { const r = R(n); if (sw == null) c.drawImage(atlasImg, r[0], r[1], r[2], r[3], Math.round(x), Math.round(y), r[2], r[3]);
  else c.drawImage(atlasImg, r[0] + sx, r[1] + sy, sw, sh, Math.round(x), Math.round(y), sw, sh); }
// 9-slice: stretch a framed sprite to any size by tiling its edges and middle
function nine(c, n, x, y, w, h, ins = 14) {
  const [, , sw0, sh0] = R(n), m = ins;
  // corners come from the real corners; edges and middle repeat a narrow plain strip from the centre, so no rivets or seams repeat
  const S2 = 12, cx = Math.floor(sw0 / 2 - S2 / 2), cy = Math.floor(sh0 / 2 - S2 / 2);
  spr(c, n, x, y, 0, 0, m, m); spr(c, n, x + w - m, y, sw0 - m, 0, m, m); spr(c, n, x, y + h - m, 0, sh0 - m, m, m); spr(c, n, x + w - m, y + h - m, sw0 - m, sh0 - m, m, m);
  for (let xx = x + m; xx < x + w - m; xx += S2) { const ww = Math.min(S2, x + w - m - xx); spr(c, n, xx, y, cx, 0, ww, m); spr(c, n, xx, y + h - m, cx, sh0 - m, ww, m); }
  for (let yy = y + m; yy < y + h - m; yy += S2) { const hh = Math.min(S2, y + h - m - yy); spr(c, n, x, yy, 0, cy, m, hh); spr(c, n, x + w - m, yy, sw0 - m, cy, m, hh);
    for (let xx = x + m; xx < x + w - m; xx += S2) spr(c, n, xx, yy, cx, cy, Math.min(S2, x + w - m - xx), hh); }
}

/* ---- bitmap fonts (pre-rendered glyphs in the atlas), tinted copies cached ---- */
const glyphCache = new Map();
function glyph(font, ch, col) {
  const key = font + ch + col; let g = glyphCache.get(key); if (g) return g;
  const name = ch === "Qu" ? `g_${font}_Qu` : `g_${font}_${ch.charCodeAt(0)}`; const r = R(name); if (!r) return null;
  g = document.createElement("canvas"); g.width = r[2]; g.height = r[3]; const x = g.getContext("2d");
  x.drawImage(atlasImg, r[0], r[1], r[2], r[3], 0, 0, r[2], r[3]); x.globalCompositeOperation = "source-in"; x.fillStyle = col; x.fillRect(0, 0, r[2], r[3]);
  glyphCache.set(key, g); return g;
}

/* ================= boot ================= */
